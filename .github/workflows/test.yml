name: Test & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install OpenSCAD
      run: |
        sudo apt-get update
        sudo apt-get install -y openscad xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check server.py --select=E,F,W --ignore=E501,E402
      continue-on-error: true

    - name: Validate import
      run: python -c "import server; print('Import OK')"

    - name: Run tests with coverage
      run: |
        xvfb-run -a pytest --cov=server --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -v tests/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-openscad"
version = "0.8.0"
description = "MCP server for OpenSCAD — parametric CAD generation for laser cutting, 3D printing, and CNC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thalis Antunes"}
]
keywords = [
    "mcp", "openscad", "cad", "laser-cutting", "3d-printing", "cnc",
    "parametric-design", "digital-fabrication", "model-context-protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/thalisantunes/mcp-openscad"
Repository = "https://github.com/thalisantunes/mcp-openscad"
Issues = "https://github.com/thalisantunes/mcp-openscad/issues"

[project.scripts]
mcp-openscad = "server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["server"]
